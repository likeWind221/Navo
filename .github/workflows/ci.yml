name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - shell: pwsh
        env:
          NAVO_SHELL_DIAG: "1"
        run: |
          for ($i = 1; $i -le 4; $i++) {
            Write-Output "[diag-round] $i"
            pnpm test
            Write-Output "[diag-round-exit] $i $LASTEXITCODE"
          }
          exit 0
