<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Navo — Adaptive long-horizon agent orchestration</title>
<desc id="desc">Navo coordinates long-running work through an adaptive roadmap, Main Agent, Node Agents, and controlled resources.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbfdfb"/><stop offset="100%" stop-color="#f0f8f3"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#36a875"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#245f48" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="620" rx="28" fill="url(#bg)"/>
<g stroke="#dcefe4" stroke-width="1.5" opacity=".8"><path d="M0 100H760M0 155H690M0 210H730M0 265H620"/><path d="M1040 0V620M1110 0V620M1180 0V620M1250 0V620"/></g>
<path d="M0 535C180 470 300 590 470 560S720 480 870 535s270 90 420 20 220-30 310-5v70H0Z" fill="#e6f5ec"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="86" y="110" font-size="17" font-weight="700" letter-spacing="4" fill="#6c8c7d">LONG-HORIZON AGENT ORCHESTRATION</text>
  <text x="82" y="245" font-size="118" font-weight="800" letter-spacing="-5" fill="#124b3d">Navo</text>
  <text x="88" y="315" font-size="43" font-weight="750" fill="#173f35">Long-running work,</text>
  <text x="88" y="366" font-size="43" font-weight="750" fill="#173f35">coordinated with control.</text>
  <text x="90" y="414" font-size="21" fill="#647c70">Adaptive roadmaps. Isolated node execution.</text>
  <text x="90" y="444" font-size="21" fill="#647c70">Controlled resources. Human confirmation.</text>
  <g font-size="15" font-weight="700">
    <rect x="88" y="488" width="174" height="40" rx="20" fill="#e2f5e9" stroke="#c5e7d4"/><text x="175" y="513" text-anchor="middle" fill="#137451">Adaptive Roadmap</text>
    <rect x="274" y="488" width="142" height="40" rx="20" fill="#e2f5e9" stroke="#c5e7d4"/><text x="345" y="513" text-anchor="middle" fill="#137451">Multi-Agent</text>
    <rect x="428" y="488" width="192" height="40" rx="20" fill="#e2f5e9" stroke="#c5e7d4"/><text x="524" y="513" text-anchor="middle" fill="#137451">Human in the loop</text>
  </g>
</g>
<g filter="url(#shadow)">
  <rect x="800" y="54" width="720" height="500" rx="28" fill="#fff" stroke="#d9ebe1" stroke-width="2"/>
  <rect x="844" y="92" width="632" height="94" rx="18" fill="#f6fbf8" stroke="#dcefe4"/>
  <rect x="844" y="220" width="268" height="130" rx="18" fill="#fff" stroke="#dcefe4"/>
  <rect x="1132" y="220" width="344" height="130" rx="18" fill="#fff" stroke="#dcefe4"/>
  <rect x="844" y="384" width="632" height="124" rx="18" fill="#f7fbf8" stroke="#dcefe4"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#173f35">
  <circle cx="883" cy="126" r="22" fill="#e2f5e9"/><circle cx="883" cy="126" r="10" fill="none" stroke="#15805e" stroke-width="3"/><circle cx="883" cy="126" r="3" fill="#15805e"/><path d="M888 121l8-8" stroke="#15805e" stroke-width="3" stroke-linecap="round"/>
  <text x="920" y="122" font-size="25" font-weight="750">Goal → Adaptive Roadmap</text>
  <text x="920" y="151" font-size="16" fill="#6b8378">Break a large objective into dependent, editable steps.</text>
  <g><rect x="920" y="164" width="88" height="9" rx="4.5" fill="url(#green)"/><rect x="1022" y="164" width="88" height="9" rx="4.5" fill="#bde7d0"/><rect x="1124" y="164" width="88" height="9" rx="4.5" fill="#d7efe2"/><rect x="1226" y="164" width="88" height="9" rx="4.5" fill="#e7f4ed"/><rect x="1328" y="164" width="88" height="9" rx="4.5" fill="#edf7f1"/></g>
  <circle cx="879" cy="260" r="22" fill="#e2f5e9"/><rect x="863" y="248" width="32" height="25" rx="8" fill="#106a51"/><circle cx="873" cy="260" r="3" fill="#dff4e9"/><circle cx="885" cy="260" r="3" fill="#dff4e9"/><path d="M879 248v-8" stroke="#106a51" stroke-width="3" stroke-linecap="round"/><circle cx="879" cy="237" r="3" fill="#106a51"/>
  <text x="915" y="264" font-size="23" font-weight="750">Main Agent</text><text x="868" y="307" font-size="16" fill="#6b8378">Plan · coordinate · replan</text>
  <text x="1160" y="253" font-size="22" font-weight="750">Node Agents</text><text x="1160" y="277" font-size="15" fill="#6b8378">Scoped execution, one node at a time</text>
  <g fill="#e8f7ef" stroke="#c9e8d7"><rect x="1160" y="292" width="78" height="40" rx="12"/><rect x="1250" y="292" width="78" height="40" rx="12"/><rect x="1340" y="292" width="78" height="40" rx="12"/></g>
  <g fill="#147b58"><circle cx="1199" cy="304" r="5"/><rect x="1187" y="312" width="24" height="12" rx="6"/><circle cx="1289" cy="304" r="5"/><rect x="1277" y="312" width="24" height="12" rx="6"/><circle cx="1379" cy="304" r="5"/><rect x="1367" y="312" width="24" height="12" rx="6"/></g>
  <text x="870" y="420" font-size="23" font-weight="750">Resources &amp; Mailbox</text><text x="870" y="448" font-size="16" fill="#6b8378">Share artifacts with explicit access boundaries.</text>
  <g fill="#e5f5ec"><rect x="870" y="463" width="66" height="30" rx="9"/><rect x="950" y="463" width="66" height="30" rx="9"/><rect x="1030" y="463" width="66" height="30" rx="9"/><rect x="1110" y="463" width="66" height="30" rx="9"/></g>
