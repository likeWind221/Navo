<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">How Navo Works</title>
<desc id="desc">Three steps: define a goal, coordinate node execution, and review outputs before continuing.</desc>
